name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The engines need only these; the full requirements.txt adds optional add-ons the tests do not use.
      - run: pip install "qiskit>=1.0,<2.0" "qiskit-aer>=0.15" numpy scipy pandas matplotlib pytest
      - run: python -m pytest -q

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "qiskit>=1.0,<2.0" "qiskit-aer>=0.15" numpy scipy pandas
      - run: npm ci
        working-directory: web/server
      - run: npm test # finds python3 on PATH, the interpreter the step above installed Qiskit into
        working-directory: web/server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web/client
      - run: npm test
        working-directory: web/client
      - run: npm run build
        working-directory: web/client
