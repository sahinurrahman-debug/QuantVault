# Render Blueprint for QuantVault (Express API + React client + Python engines in one Docker service).
# Database: MongoDB Atlas (set MONGODB_URI when Render prompts for it; it is never stored in git).
services:
  - type: web
    name: quantvault
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false            # prompted at Blueprint creation; paste your Atlas connection string
      - key: NODE_ENV
        value: production
      # Python work runs in two lanes (quick scoring: 2 at a time; QKD simulations: 1 at a time), so a long
      # simulation never blocks the dashboard. Override with PYTHON_CONCURRENCY / PYTHON_HEAVY_CONCURRENCY.
      # Sessions use a Secure, httpOnly __Host- cookie in production (Render serves HTTPS); nothing to configure.
